services:
  web:
    build:
      context: ../consegna
      dockerfile: ../materiali-sviluppo/Dockerfile
    ports:
      - "127.0.0.1:8086:80"
    environment:
      DB_DSN: mysql:host=db;dbname=passoverde;charset=utf8mb4
      DB_USER: passoverde
      DB_PASSWORD: local_demo_only
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: passoverde
      MARIADB_USER: passoverde
      MARIADB_PASSWORD: local_demo_only
      MARIADB_ROOT_PASSWORD: local_root_demo_only
    volumes:
      - passoverde_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  passoverde_db:
